<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; gap: min(var(--gap), 2.5vh); }
  .bar { margin-bottom: 0; }
  .big { font-size: min(var(--fs-xxl), 11vh); line-height: 1.05; }
  #mode { font-size: min(var(--fs-xxl), 11vh, 10.5vw); font-weight: 900; line-height: 1; letter-spacing: 0.02em; }
  #exname { font-size: var(--fs-s); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  #prompt { font-size: min(var(--fs-xl), 7vh); font-weight: 800; text-align: center; min-height: 1.2em; }
  .panel { padding: min(var(--gap), 2.5vh) var(--gap); }

  .track-wrap { position: relative; padding: 1.6em 4% 2em; }
  .track {
    position: relative; height: clamp(18px, 3vw, 34px); border-radius: 999px;
    background: var(--line);
  }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; width: 0; opacity: 0.45; }
  .flag {
    position: absolute; top: 100%; margin-top: 0.4em; transform: translateX(-50%);
    font-size: var(--fs-s); color: var(--muted); white-space: nowrap;
  }
  .flag::before {
    content: ""; position: absolute; left: 50%; bottom: calc(100% + 0.4em); width: 4px;
    height: clamp(30px, 5vw, 60px); transform: translateX(-50%); background: var(--muted);
  }
  .dotm {
    position: absolute; top: 50%; left: 0; border-radius: 50%;
    transform: translate(-50%, -50%); will-change: left;
  }
  #hand { width: clamp(44px, 7vw, 90px); height: clamp(44px, 7vw, 90px); background: var(--fg);
          box-shadow: 0 0 0 6px var(--bg), 0 0 30px rgba(255,255,255,.35); z-index: 2; }
  #target { width: clamp(52px, 8vw, 104px); height: clamp(52px, 8vw, 104px);
            border: 5px dashed var(--free); background: transparent; z-index: 1; }

  .tiles { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .tile { text-align: center; }
  .tile .label { font-size: var(--fs-s); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .meter { height: 18px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 0.4em; }
  .meter > div { height: 100%; width: 0; background: var(--ok); }

  .dial-ends { display: flex; justify-content: space-between; font-size: var(--fs-s); font-weight: 700; }
  .gauge {
    position: relative; height: clamp(22px, 3.5vw, 40px); border-radius: 999px; margin: 0.4em 3%;
    background: linear-gradient(90deg, var(--resist), var(--free) 50%, var(--assist));
  }
  .gauge .mid { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 3px; background: var(--bg); }
  #needle {
    position: absolute; top: 50%; left: 50%; width: clamp(28px, 4vw, 46px); height: clamp(28px, 4vw, 46px);
    border-radius: 50%; background: var(--fg); border: 5px solid var(--bg);
    transform: translate(-50%, -50%); transition: left 0.4s ease;
  }
  #last { text-align: center; }
  #cal { display: none; text-align: center; }
  #cal.on { display: block; }
  #cal .meter { height: clamp(22px, 3.5vw, 40px); margin: 0.4em 3% 0; }
  #calnote { font-size: var(--fs-s); color: var(--muted); margin-top: 0.4em; }
  #hint { text-align: center; font-size: var(--fs-s); color: var(--muted); min-height: 1.2em; }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: var(--gap); font-size: var(--fs-xl); font-weight: 900; z-index: 10;
  }
  .overlay.on { display: flex; }
  #waiting { background: rgba(11, 13, 16, 0.88); color: var(--muted); }
  #holding { background: rgba(120, 0, 0, 0.92); color: #fff; }
  .overlay .badge { position: absolute; top: var(--gap); right: var(--gap); }
</style>
</head>
<body>
<div class="bar">
  <div><div id="exname"></div><div id="mode" class="mode-free">–</div></div>
  <div class="row">
    <span id="dot" class="dot connecting"></span>
    <span id="badge" class="badge none">NO DATA</span>
  </div>
</div>

<div class="panel">
  <div class="dial-ends"><span class="mode-resist">Challenge</span><span class="mode-free">Free</span><span class="mode-assist">Help</span></div>
  <div class="gauge"><div class="mid"></div><div id="needle"></div></div>
</div>

<div id="prompt"></div>
<div id="hint"></div>
<div id="cal" class="panel">
  <div class="label">Your push now: <b id="calforce">–</b></div>
  <div class="meter"><div id="calbar"></div></div>
  <div id="calnote"></div>
</div>

<div class="panel track-wrap">
  <div class="track">
    <div id="fill" class="fill bg-free"></div>
    <span class="flag" style="left:0%">Start</span>
    <span class="flag" style="left:100%">Reach</span>
    <div id="target" class="dotm" style="display:none"></div>
    <div id="hand" class="dotm" style="display:none"></div>
  </div>
</div>

<div class="tiles">
  <div class="panel tile">
    <div class="label">Reps</div>
    <div id="reps" class="big">0</div>
  </div>
  <div class="panel tile">
    <div class="label" id="contribLabel">You did (last rep)</div>
    <div id="contrib" class="big">–</div>
  </div>
  <div class="panel tile">
    <div class="label">Your push</div>
    <div id="force" class="big">–</div>
    <div class="meter"><div id="forcebar"></div></div>
  </div>
</div>

<div id="last" class="small muted"></div>

<div id="waiting" class="overlay on"><span id="badge2" class="badge none">NO DATA</span>Waiting for the session to start</div>
<div id="holding" class="overlay"><span id="badge3" class="badge none">NO DATA</span>Arm stopped safely. Please wait.</div>

<script type="module">
import { connectLive, api, simBanner, modeOf, fmt } from "./common.js";
import { Track } from "./track.js";

const $ = id => document.getElementById(id);
const FORCE_MAX_N = 40;          // bar full scale
const STALE_MS = 2000;           // no samples this long: session has ended
const MODE_WORD = { assist: "HELPING", free: "FREE", resist: "CHALLENGING" };
const CAL_PROMPT = "Push once at a level that feels comfortable";
const CAL_SHOW_MS = 6000;        // "Resistance set: X N" stays in the prompt this long after the push
let calDoneAt = null;
const PROMPT = { calibrate: CAL_PROMPT, idle: "Rest", out: "Reach out", back: "Come back", setup: "Move the handle to the far end" };
const PROMPT_BY_EX = {      // exercise id -> wording that differs from the reach
  push: { out: "Push forward" },
  pull: { out: "Pull towards you", back: "Let it go back" },
  armtest: { out: "Push and hold", back: "Rest" },
};
const EX_NAMES = { reach: "Forward reach", push: "Push", pull: "Row", armtest: "Push strength test" };
let bestTry = null;          // armtest: highest peak force so far, N
const pct = x => `${(Math.max(-0.05, Math.min(1.05, x)) * 100).toFixed(2)}%`;

const track = new Track(0.30);
let latest = null, drawn = null, lastAt = 0;

function banner(sim) { for (const id of ["badge", "badge2", "badge3"]) simBanner($(id), sim); }

function draw() {
  requestAnimationFrame(draw);
  const live = latest && performance.now() - lastAt < STALE_MS;
  $("waiting").classList.toggle("on", !live);
  if (!live || latest === drawn) return;
  const m = drawn = latest;

  const ex = m.exercise || "reach";
  const test = ex === "armtest";
  const mode = test ? "free" : modeOf(m.dial);
  $("exname").textContent = EX_NAMES[ex] || ex;
  $("mode").textContent = test ? "STRENGTH TEST" : MODE_WORD[mode];
  $("mode").className = `mode-${mode}`;
  const cal = m.calibration, calibrating = m.phase === "calibrate";
  const calDone = !!cal && cal.status === "done" && typeof cal.resistance_n === "number";
  if (!calDone) calDoneAt = null; else if (calDoneAt === null) calDoneAt = performance.now();
  const setText = calDone ? `Resistance set: ${cal.resistance_n.toFixed(1)} N` : "";
  const showSet = calDone && (calibrating || performance.now() - calDoneAt < CAL_SHOW_MS);
  $("prompt").textContent = showSet ? setText
    : (PROMPT_BY_EX[ex] || {})[m.phase] || PROMPT[m.phase] || "";
  $("cal").classList.toggle("on", calibrating || showSet);
  $("calnote").textContent = showSet ? "This adjusts to you each session."
    : calibrating ? "Hold the handle still and keep the push steady for 3 seconds." : "";
  // why a rep is not starting yet (the engine's own words), only while resting
  const arming = m.arming;
  $("hint").textContent = !calibrating && m.phase === "idle" && !m.done && arming && arming.reason
    ? `Not started yet: ${arming.reason}` : calDone && !showSet ? setText : "";
  $("contribLabel").textContent = test ? "Best try" : "You did (last rep)";
  $("holding").classList.toggle("on", m.arm_mode === "hold" || m.arm_mode === "fault");

  const { s, targetS } = track.update(m);
  $("hand").style.display = s === null ? "none" : "";
  if (s !== null) $("hand").style.left = pct(s);
  $("fill").style.width = pct(Math.max(0, s ?? 0));
  $("fill").className = `fill bg-${mode}`;
  const tgt = $("target");
  tgt.style.display = targetS === null || test ? "none" : "";
  if (targetS !== null) { tgt.style.left = pct(targetS); tgt.style.borderColor = `var(--${mode})`; }

  const f = Math.hypot(...(m.force || [0, 0, 0]));
  $("force").textContent = fmt.N(f);
  $("forcebar").style.width = `${Math.min(100, (f / FORCE_MAX_N) * 100)}%`;
  $("calforce").textContent = fmt.N(f);
  $("calbar").style.width = `${Math.min(100, (f / FORCE_MAX_N) * 100)}%`;
  $("reps").textContent = m.rep_count ?? 0;
  $("needle").style.left = `${((1 + Math.max(-1, Math.min(1, m.dial))) / 2) * 100}%`;
}

function onSample(m) {
  if (latest && typeof m.t === "number" && m.t < latest.t - 0.5) resetSession();
  latest = m; lastAt = performance.now();
  banner(m.simulated);
}

function onRep(r) {
  banner(r.simulated);
  if (r.mode === "isometric") {     // a strength-test try: nothing moves, only the force counts
    bestTry = Math.max(bestTry ?? 0, r.peak_force_n);
    $("contrib").textContent = fmt.N(bestTry);
    $("last").textContent = `Try ${r.idx + 1}: peak ${fmt.N(r.peak_force_n)} · best ${fmt.N(bestTry)}`;
    return;
  }
  $("contrib").textContent = fmt.pct(r.contribution);
  const bits = [`Rep ${r.idx + 1}: ${fmt.cm(r.rom_m)} reach`, `peak ${fmt.N(r.peak_force_n)}`, fmt.s(r.duration_s)];
  if (r.rescued) bits.push("arm helped finish");
  $("last").textContent = bits.join(" · ");
}

function resetSession() {
  track.reset();
  bestTry = null;
  $("contrib").textContent = "–";
  $("last").textContent = "";
}

connectLive(onSample, onRep, s => { $("dot").className = `dot ${s}`; });
api.get("/api/exercises").then(list => { for (const e of list) EX_NAMES[e.id] = e.name; }).catch(() => {});
api.get("/api/state").then(st => banner(st.session ? st.session.simulated : undefined)).catch(() => {});
requestAnimationFrame(draw);
</script>
</body>
</html>
